<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-written test drawing: two Inkscape-style layers, every supported element type,
     nested transforms, and a viewBox in user units mapped to 120 × 80 mm. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="120mm" height="80mm" viewBox="0 0 1200 800">
  <g id="layer1" inkscape:groupmode="layer" inkscape:label="Outlines">
    <rect x="50" y="50" width="1100" height="700" rx="40"/>
    <circle cx="300" cy="400" r="200"/>
    <ellipse cx="300" cy="400" rx="120" ry="60"/>
    <polygon points="700,150 900,550 500,550"/>
  </g>
  <g id="layer2" inkscape:groupmode="layer" inkscape:label="Waves">
    <g transform="translate(600 600)">
      <path d="M0 0 c50 -80 100 -80 150 0 s100 80 150 0 s100 -80 150 0"/>
      <path transform="translate(0 60) scale(1 0.5)" d="M0 0 Q75 -120 150 0 T300 0 T450 0"/>
    </g>
    <polyline points="950,150 1050,250 950,350 1050,450"/>
    <line x1="950" y1="500" x2="1100" y2="500"/>
    <path d="M1000 650 a60 60 0 1 0 120 0 a60 60 0 1 0 -120 0 z"/>
  </g>
</svg>
