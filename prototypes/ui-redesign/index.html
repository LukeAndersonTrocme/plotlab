<title>plotlab layout prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway. Question: does the agreed plotlab layout (Design/Page/Plot modes,
  setup chip, bottom thumbnail strip, phone viewer) feel right on a laptop and a phone?
  Three variants of where a step's settings open, switchable via #variant-a / #variant-b /
  #variant-c, plus #phone for the phone viewer. Fake engine on a 160x160 grid; nothing is saved.
-->
<style>
/* Layout: header (modes + setup chip) / canvas + optional sidebar / step strip along the bottom. */
:root {

  --st-image: #b7791f; --st-field: #2a8a7a; --st-geometry: #3b62b0; --st-toolpath: #b0405a;
  --proto: #1d1d1b; --proto-ink: #fffdf8;

  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a18; --panel: #24231f; --ink: #ece8df; --muted: #a39e93; --line: #3a3833;
  --accent: #7fa8d4; --accent-ink: #10151b; --warn: #e2876d; --ok: #6cc08e;
  --chip: #2e2c28; --canvas-bg: #141311; --shadow: rgba(0, 0, 0, 0.5);
  --st-image: #d9a24a; --st-field: #4fb8a6; --st-geometry: #7d9be0; --st-toolpath: #e07a92;
  --proto: #fffdf8; --proto-ink: #1d1d1b; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #24231f; --ink: #ece8df; --muted: #a39e93; --line: #3a3833;
  --accent: #7fa8d4; --accent-ink: #10151b; --warn: #e2876d; --ok: #6cc08e;
  --chip: #2e2c28; --canvas-bg: #141311; --shadow: rgba(0, 0, 0, 0.5);
  --st-image: #d9a24a; --st-field: #4fb8a6; --st-geometry: #7d9be0; --st-toolpath: #e07a92;
  --proto: #fffdf8; --proto-ink: #1d1d1b; color-scheme: dark;
}
html, body { height: 100%; }
* { box-sizing: border-box; }

button:hover:not(:disabled) { border-color: var(--muted); }

button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- desktop app ---------- */
#app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr); height: 100%; }
#app > * { min-width: 0; }
header.top { display: flex; align-items: center; gap: 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font-size: 17px; letter-spacing: 0.02em; font-weight: 600; }
.project { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.version { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; color: var(--ink); }
.modes { display: flex; background: var(--chip); border-radius: 8px; padding: 3px; margin-left: auto; }

.setup-chip:hover { border-color: var(--line); }

.top-right { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px var(--shadow); padding: 8px; z-index: 30; }
.menu h4 { margin: 4px 6px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.cp { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 8px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.cp:hover { background: var(--chip); }
.cp canvas { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.cp .t { font-weight: 600; }
.cp .s { font-size: 12px; color: var(--muted); }

main.work { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage-area { position: relative; min-width: 0; min-height: 0; background: var(--canvas-bg); }
#main-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.overlay.tl { top: 12px; left: 12px; right: 12px; }
.overlay.tr { bottom: 12px; right: 12px; justify-content: flex-end; }

.pill { font-size: 11px; padding: 1px 7px; border-radius: 9px; color: var(--panel); background: var(--st, var(--muted)); font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
.toggle-btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* settings panel (shared between the three variants) */
.settings h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.settings .sub { color: var(--muted); font-size: 12px; margin: 4px 0 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.settings .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
.settings .row-actions button { font-size: 12px; padding: 4px 8px; }
.settings .blurb { font-size: 13px; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.param { margin: 12px 0; }
.param label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; gap: 8px; }
.param input[type="range"] { width: 100%; accent-color: var(--accent); }
.param.bool label { justify-content: flex-start; gap: 8px; cursor: pointer; }
.seed-row { display: flex; gap: 6px; align-items: center; }
.seed-row input { width: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--panel); }
details.more { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
details.more summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.reason { font-size: 12px; color: var(--muted); }
.settings.horizontal .params { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.settings.horizontal .param { width: 220px; margin: 4px 0; }
.settings.horizontal details.more { border: 0; margin: 0; padding: 0; }
.settings.horizontal details.more[open] { flex-basis: 100%; }
.settings.horizontal details.more .inner { display: flex; gap: 24px; flex-wrap: wrap; }

/* sidebar cards + pinning */
.side-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 8px; display: flex; gap: 6px; }
.side-label.pinned-label { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
.card.focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.card.off { opacity: 0.6; }
.card-head { display: flex; align-items: center; gap: 6px; }
.card-title { border: 0; background: none; padding: 0; font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: center; margin-right: auto; text-align: left; }
.card-title:hover { color: var(--accent); }

.pin-drop { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; font-size: 13px; color: var(--muted); text-align: center; }
body.dragging aside.side { background: color-mix(in srgb, var(--ok) 8%, var(--panel)); }
body.dragging aside.side .pin-drop { border-color: var(--ok); color: var(--ok); }
aside.side.over .pin-drop, aside.side.over { outline: 2px dashed var(--ok); outline-offset: -6px; }
.pin-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
/* compare bar */
.cmpbar { flex-basis: 100%; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
.band-chip { display: inline-flex; align-items: center; gap: 2px; border-radius: 6px; padding: 1px 2px 1px 8px; background: color-mix(in srgb, var(--st) 22%, var(--panel)); border: 1px solid var(--st); }
.band-chip select { border: 0; background: transparent; padding: 2px; }
.band-chip button { border: 0; background: none; padding: 0 5px; color: var(--muted); }
.cmpbar .sep { color: var(--muted); }

.cmpbar .quick button { font-size: 12px; padding: 3px 8px; }
/* strip resize */
.strip-grip { height: 10px; margin: -8px 0 2px; cursor: ns-resize; display: flex; justify-content: center; align-items: center; touch-action: none; }
.strip-grip::before { content: ""; width: 44px; height: 4px; border-radius: 2px; background: var(--line); }
.strip-grip:hover::before { background: var(--muted); }
.size-btns { display: inline-flex; gap: 2px; align-items: center; }
.size-btns button { padding: 1px 8px; font-size: 13px; }
.cp-group { display: inline-flex; }
.cp-group button:first-child { border-radius: 6px 0 0 6px; }
.cp-group button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.menu .explain { font-size: 12px; color: var(--muted); margin: -4px 6px 8px; }

/* CMYK lanes */
.lanes { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; }
.trunk { display: flex; align-items: center; gap: 6px; flex: none; }
.trunk .arrow { color: var(--muted); font-size: 18px; }
.lane-rows { display: flex; flex-direction: column; gap: 4px; flex: none; border-left: 2px solid var(--line); border-right: 2px solid var(--line); padding: 0 8px; }
.lane { display: flex; align-items: center; border-radius: 8px; padding: 2px 4px; }
.lane.over { outline: 2px dashed var(--ok); }
.lane.hidden-lane { opacity: 0.4; }
.lane-head { display: flex; align-items: center; gap: 4px; cursor: grab; margin-right: 4px; }
.lane-head .grip { color: var(--muted); letter-spacing: -2px; }
.lane-head .ink { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.box.small { width: calc(var(--thumb) * 0.5 + 12px); padding-bottom: 4px; }
.box.small canvas { width: calc(var(--thumb) * 0.5); height: calc(var(--thumb) * 0.5); margin: 4px auto 0; }

.lane .gap { width: 16px; }
.lane .gap .plus { width: 18px; height: 18px; font-size: 12px; }
.add-menu { max-height: 60vh; overflow-y: auto; }
.proto-bar button[aria-pressed="true"] { background: color-mix(in srgb, var(--proto-ink) 22%, transparent); font-weight: 600; }
.cmpbar .seg button { padding: 3px 9px; font-size: 12px; }

.lane-head .inks4 { display: grid; grid-template-columns: 10px 10px; gap: 2px; }
.lane-head .inks4 i { width: 10px; height: 10px; border-radius: 50%; }
.box.wide .band { text-transform: none; font-size: 11px; letter-spacing: 0.01em; }
.strip-head .seg button { font-size: 12px; padding: 2px 9px; }

/* variant B popover, variant C drawer */
#popover { position: fixed; width: 320px; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px var(--shadow); padding: 14px 16px; z-index: 20; }
#popover .x { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 18px; color: var(--muted); }
#drawer { background: var(--panel); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 34vh; overflow-y: auto; }
#drawer .settings { display: grid; grid-template-columns: 260px 1fr; gap: 24px; }

/* ---------- the strip ---------- */
.strip-wrap { background: var(--panel); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.strip-head { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.strip-head strong { color: var(--ink); font-size: 13px; }
.legend { display: flex; gap: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--st); display: inline-block; }
.hint { color: var(--accent); }
.strip-head .end { margin-left: auto; display: flex; gap: 6px; }
.strip { display: flex; align-items: stretch; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
.box { position: relative; flex: none; width: calc(var(--thumb) + 16px); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; padding: 0 0 6px; user-select: none; transition: transform 0.12s; }
.box:hover { border-color: var(--muted); }
.box.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.box .band { height: 18px; border-radius: 7px 7px 0 0; background: linear-gradient(90deg, var(--in) 0 50%, var(--out) 50% 100%); color: #fff; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; display: flex; justify-content: space-between; }
.box .band.same { background: var(--out); }
.box canvas { display: block; width: var(--thumb); height: var(--thumb); margin: 6px auto 4px; border-radius: 3px; }
.box .lbl { font-size: 12px; text-align: center; display: flex; gap: 5px; justify-content: center; align-items: center; padding: 0 4px; }
.box .ic { font-size: 14px; color: var(--muted); }
.box .byp { position: absolute; top: 22px; right: 4px; width: 24px; height: 24px; padding: 0; border-radius: 50%; font-size: 12px; line-height: 1; opacity: 0; transition: opacity 0.12s; background: var(--panel); }
.box:hover .byp, .box.off .byp, .box .byp:focus-visible { opacity: 1; }
.box.off canvas { opacity: 0.25; filter: grayscale(1); }
.box.off .lbl { text-decoration: line-through; color: var(--muted); }
.box.dragging { opacity: 0.4; }
.box.source { cursor: pointer; }
.gap { flex: none; width: 24px; display: flex; align-items: center; justify-content: center; transition: width 0.12s, background 0.12s; border-radius: 6px; }
.gap .plus { width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 14px; line-height: 1; opacity: 0.35; }
.gap:hover .plus, .gap .plus:focus-visible { opacity: 1; }
body.dragging .gap .plus { visibility: hidden; }
body.dragging .gap.drop-ok { width: 46px; background: color-mix(in srgb, var(--ok) 18%, transparent); outline: 2px dashed var(--ok); outline-offset: -4px; }
body.dragging .gap.drop-ok.over { background: color-mix(in srgb, var(--ok) 40%, transparent); }
body.dragging .gap.drop-no { opacity: 0.3; }
.add-menu { position: fixed; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px var(--shadow); padding: 6px; z-index: 40; }
.add-menu .h { font-size: 12px; color: var(--muted); padding: 6px 8px; }
.add-menu button { display: flex; width: 100%; text-align: left; border: 0; gap: 10px; align-items: flex-start; padding: 7px 8px; background: none; }
.add-menu button:hover { background: var(--chip); }
.add-menu .ic { width: 20px; font-size: 16px; text-align: center; }
.add-menu small { display: block; color: var(--muted); font-size: 12px; }

/* pen strip (Plot mode) */
.penbox { flex: none; width: 150px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; gap: 8px; align-items: center; background: var(--panel); cursor: pointer; margin-right: 8px; }
.penbox.sel { outline: 2px solid var(--accent); }
.penbox canvas { width: 56px; height: 56px; border-radius: 3px; border: 1px solid var(--line); flex: none; }
.penbox .t { font-size: 12px; font-weight: 600; }
.penbox .s { font-size: 11px; color: var(--muted); }
.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid var(--line); vertical-align: -1px; }

/* side panels for Page / Plot */
.panel-sec { margin-bottom: 18px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.field-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0; }
.pen-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }

.bigtime { font-size: 34px; font-weight: 600; }

.breakdown span:nth-child(even) { text-align: right; }

.play-row input { flex: 1; accent-color: var(--accent); }
.export { display: grid; gap: 8px; }

/* gallery */
.modal-bg { position: fixed; inset: 0; background: rgba(20, 18, 15, 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; width: min(860px, 100%); max-height: 90vh; overflow-y: auto; padding: 18px 20px; box-shadow: 0 20px 48px var(--shadow); }
.modal h2 { margin: 0 0 4px; font-size: 18px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-top: 14px; }

/* prototype switcher (not part of the design) */
.proto-bar { position: fixed; top: 34%; left: calc(12px + env(safe-area-inset-left, 0px)); flex-direction: column; z-index: 60; background: var(--proto); color: var(--proto-ink); border-radius: 999px; display: flex; align-items: center; gap: 4px; padding: 4px; box-shadow: 0 6px 20px var(--shadow); font-size: 12px; }

.proto-bar button:hover { background: color-mix(in srgb, var(--proto-ink) 15%, transparent); }
.proto-bar .lab { padding: 0 6px; white-space: nowrap; }

/* ---------- phone viewer ---------- */
#phone { display: none; height: 100%; }
body.phone #app { display: none; }
body.phone #phone { display: block; }
body.phone-preview { background: var(--canvas-bg); }
body.phone-preview #phone { display: grid; place-items: center; padding-block: 20px; }
.ph { height: 100%; width: 100%; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
body.phone-preview .ph { width: 390px; height: min(800px, 100%); border-radius: 36px; border: 10px solid #111; box-shadow: 0 20px 48px var(--shadow); }
.ph-head { display: flex; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.ph-head .t { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-body { flex: 1; overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.ph-note { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.ph-card { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px; border-radius: 12px; margin-bottom: 10px; background: var(--panel); }
.ph-card canvas { width: 72px; height: 72px; border-radius: 6px; border: 1px solid var(--line); flex: none; }
.ph-card .t { font-weight: 600; }
.ph-card .s { font-size: 12px; color: var(--muted); }
.ph-view { position: relative; background: var(--canvas-bg); border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%; }
.ph-view canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.ph-ctrl { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
.ph-ctrl input { flex: 1; accent-color: var(--accent); }
.ph-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scroll-snap-type: x mandatory; }
.ph-strip .box { width: 84px; scroll-snap-align: start; }
.ph-strip .box canvas { width: 70px; height: 70px; }
.ph-sec { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; }
.ph-cps { display: flex; flex-direction: column; gap: 6px; }

@media (max-width: 1180px) {
  aside.side { width: 280px; }
  .strip-head .legend { display: none; }
  .modes button { padding: 5px 10px; }
  .top-right .setup-chip { max-width: 260px; overflow: hidden; white-space: nowrap; }
}
@media (max-width: 960px) {
  header.top .project, header.top .setup-chip { display: none; }
  #cp-quick { font-size: 0; } #cp-quick::before { content: "+ Save"; font-size: 14px; }
}
header.top { overflow: hidden; }
.strip-head > span:nth-child(2) { min-width: 0; }
@media (max-width: 700px) {
  .proto-bar .tag { display: none; }
  .proto-bar { flex-direction: row; top: auto; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .ph-body { padding-bottom: 70px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

try { const t0 = +localStorage.getItem("plotlab-proto-thumb"); if (t0) document.documentElement.style.setProperty("--thumb", t0 + "px"); } catch (_) {}
document.addEventListener("pointerdown", (e) => {

});
function tick() {
  if (!playing) return;
  plotT = Math.min(1, plotT + 0.004); const r = $("#plot-t"); if (r) r.value = plotT; drawMain();
  if (plotT >= 1) { playing = false; const b = $("#play"); if (b) b.textContent = "Play"; return; }
  requestAnimationFrame(tick);
}

function openAddMenu(g, anchor) {
  closeMenus();
  const opts = Object.keys(DEFS).map((id) => { const r = recipe.slice(); r.splice(g, 0, mk(id)); return chainOK(r) ? { id, out: ioAt(r, g).out } : null; }).filter(Boolean);
  const left = g === 0 ? ctxStart.stage : outStage(recipe, g - 1);
  const where = view === "cmyk" ? (cmyk.linked ? " for all four inks" : ` in the ${INKC[cmyk.lane].name.toLowerCase()} lane`) : "";
  const split = view === "editor" && left === "image" ? `<button data-split><span class="ic">◧</span><span><strong>Separate CMYK</strong> <span class="pill" style="--st:var(--st-field)">4 × Field</span><small>Splits the photo into four inks, one lane each. The steps after this point drive all four, linked.</small></span></button>` : "";
  const m = document.createElement("div"); m.className = "add-menu";
  m.innerHTML = `<div class="h">Steps that fit here${where} (after ${STAGES[left].label.toLowerCase()})</div>` +
    (opts.length ? opts.map(({ id, out }) => `<button data-add="${id}" data-g="${g}"><span class="ic">${DEFS[id].icon}</span><span><strong>${DEFS[id].name}</strong> <span class="pill" style="--st:${stv(out)}">${STAGES[out].label}</span><small>${DEFS[id].blurb}</small></span></button>`).join("")
      : `<div class="h">Nothing fits here. Each step turns its input into the next stage: Image → Field → Geometry → Toolpath.</div>`) + split;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.left = Math.min(window.innerWidth - 272, Math.max(8, r.left - 120)) + "px";
  m.style.bottom = window.innerHeight - r.top + 8 + "px";
}

/* drag to reorder */
let dragFrom = null, laneDrag = null;
document.addEventListener("dragstart", (e) => {
  const lh = e.target.closest?.("[data-lane-drag]");
  if (lh) { laneDrag = lh.dataset.laneDrag; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", laneDrag); const h = $("#strip-hint"); if (h) h.textContent = "Drop on another lane to change the plot order."; return; }
  const box = e.target.closest?.("#strip .box[draggable]"); if (!box) return;
  if (box.dataset.lane) useLane(box.dataset.lane);
  dragFrom = +box.dataset.i; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragFrom));
  box.classList.add("dragging"); document.body.classList.add("dragging");
  let ok = 0;
  box.closest(".strip-row").querySelectorAll(".gap").forEach((gp) => {
    const g = +gp.dataset.g;
    if (g === dragFrom || g === dragFrom + 1) return;
    const r = recipe.slice(), [it] = r.splice(dragFrom, 1); r.splice(g > dragFrom ? g - 1 : g, 0, it);
    const v = chainOK(r); gp.classList.add(v ? "drop-ok" : "drop-no"); ok += v;
  });
  const d = DEFS[recipe[dragFrom].step], io = ioAt(recipe, dragFrom);
  $("#strip-hint").textContent = ok ? `${d.name} can move to ${ok} place${ok > 1 ? "s" : ""}: the green gaps. Or drop it on the sidebar to pin it.`
    : `${d.name} has nowhere else to go here: it needs ${STAGES[io.inn].label.toLowerCase()} input. You can still drop it on the sidebar to pin it.`;
});
document.addEventListener("dragover", (e) => { if (!laneDrag) return; const row = e.target.closest?.("[data-lane-row]"); document.querySelectorAll(".lane.over").forEach((x) => x !== row && x.classList.remove("over")); if (!row) return; e.preventDefault(); row.classList.add("over"); });
document.addEventListener("drop", (e) => {
  if (!laneDrag) return; const row = e.target.closest?.("[data-lane-row]"); if (!row) return; e.preventDefault();
  const to = cmyk.order.indexOf(row.dataset.laneRow); cmyk.order.splice(cmyk.order.indexOf(laneDrag), 1); cmyk.order.splice(to, 0, laneDrag); laneDrag = null;
  renderStrip(); renderPanels(); drawThumbs(); drawMain(); renderOverlays(); renderChip(); toast(`Plot order: ${cmyk.order.map((k) => INKC[k].name).join(" → ")}.`);
});
document.addEventListener("dragover", (e) => { const sd = e.target.closest?.("aside.side"); if (sd && dragFrom != null) { e.preventDefault(); sd.classList.add("over"); return; } document.querySelector("aside.side.over")?.classList.remove("over"); });
document.addEventListener("dragover", (e) => { const gp = e.target.closest?.(".gap.drop-ok"); if (!gp) return; e.preventDefault(); document.querySelectorAll(".gap.over").forEach((x) => x !== gp && x.classList.remove("over")); gp.classList.add("over"); });
document.addEventListener("drop", (e) => {
  if (e.target.closest?.("aside.side") && dragFrom != null) { e.preventDefault(); const u = recipe[dragFrom].uid; dragFrom = null; document.body.classList.remove("dragging"); $("aside.side").classList.remove("over"); if (!pinned.has(u)) togglePin(u); return; }
  const gp = e.target.closest?.(".gap.drop-ok"); if (!gp || dragFrom == null) return; e.preventDefault();
  const g = +gp.dataset.g, [it] = recipe.splice(dragFrom, 1), to = g > dragFrom ? g - 1 : g; recipe.splice(to, 0, it);
  dragFrom = null; document.body.classList.remove("dragging"); select(to); toast(`Moved ${DEFS[it.step].name}.`);
});
document.addEventListener("dragend", () => { dragFrom = null; laneDrag = null; document.querySelectorAll(".lane.over").forEach((x) => x.classList.remove("over")); document.body.classList.remove("dragging"); document.querySelectorAll(".gap,.box").forEach((x) => x.classList.remove("drop-ok", "drop-no", "over", "dragging")); const h = $("#strip-hint"); if (h) h.textContent = ""; });

/* compare: drag dividers, the lens, or boxes */
(() => {
  const cv = $("#main-canvas"); let dr = null;
  const fr = (e) => { const c = cv._content, r = cv.getBoundingClientRect(); return [(e.clientX - r.left - c.cx) / c.side, (e.clientY - r.top - c.cy) / c.side]; };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const move = (e) => {
    if (!dr) return; const [fx, fy] = fr(e);
    if (dr.t === "split") { const k = dr.k, s = cmp.splits, f = cmp.layout === "rows" ? fy : fx; s[k] = clamp(f, k ? s[k - 1] + 0.02 : 0, k < s.length - 1 ? s[k + 1] - 0.02 : 1); }
    else if (dr.t === "lens") { cmp.lens.x = clamp(fx - dr.dx); cmp.lens.y = clamp(fy - dr.dy); }
    else if (dr.t === "move") { dr.b.x = clamp(fx - dr.dx, 0, 1 - dr.b.w); dr.b.y = clamp(fy - dr.dy, 0, 1 - dr.b.h); }
    else if (dr.t === "resize") { dr.b.w = clamp(fx - dr.b.x, 0.05, 1 - dr.b.x); dr.b.h = clamp(fy - dr.b.y, 0.05, 1 - dr.b.y); }
    else if (dr.t === "new") { const x1 = clamp(fx), y1 = clamp(fy); dr.b.x = Math.min(dr.x0, x1); dr.b.y = Math.min(dr.y0, y1); dr.b.w = Math.abs(x1 - dr.x0); dr.b.h = Math.abs(y1 - dr.y0); }
    drawMain();
  };
  cv.addEventListener("pointerdown", (e) => {
    if (!cmp || mode !== "design" || view !== "editor" || !cv._content) return;
    const [fx, fy] = fr(e), L = cmp.layout;
    if (L === "cols" || L === "rows") { const f = L === "rows" ? fy : fx; let best = Infinity, k = -1; cmp.splits.forEach((s, i) => { if (Math.abs(s - f) < best) { best = Math.abs(s - f); k = i; } }); if (k < 0) return; dr = { t: "split", k }; }
    else if (L === "lens") { const inside = Math.hypot(fx - cmp.lens.x, fy - cmp.lens.y) < cmp.lens.r; dr = { t: "lens", dx: inside ? fx - cmp.lens.x : 0, dy: inside ? fy - cmp.lens.y : 0 }; }
    else {
      const hit = [...cmp.boxes].reverse().find((b) => fx >= b.x && fx <= b.x + b.w && fy >= b.y && fy <= b.y + b.h);
      if (hit && fx > hit.x + hit.w - 0.04 && fy > hit.y + hit.h - 0.04) dr = { t: "resize", b: hit };
      else if (hit) dr = { t: "move", b: hit, dx: fx - hit.x, dy: fy - hit.y };
      else { if (fx < 0 || fy < 0 || fx > 1 || fy > 1) return; const b = { x: fx, y: fy, w: 0, h: 0, uid: selUid() }; cmp.boxes.push(b); dr = { t: "new", b, x0: fx, y0: fy }; }
    }
    cv.setPointerCapture(e.pointerId); move(e);
  });
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerup", () => {
    if (dr?.t === "new") { const b = dr.b; if (b.w < 0.03 || b.h < 0.03) { b.w = b.h = 0.28; b.x = clamp(b.x - 0.14, 0, 0.72); b.y = clamp(b.y - 0.14, 0, 0.72); } renderOverlays(); drawMain(); }
    dr = null;
  });
  cv.addEventListener("wheel", (e) => { if (!cmp || cmp.layout !== "lens" || view !== "editor") return; e.preventDefault(); cmp.lens.r = clamp(cmp.lens.r * Math.exp(-e.deltaY * 0.0015), 0.05, 0.5); const r = $("#cmp-r"); if (r) r.value = cmp.lens.r; drawMain(); }, { passive: false });
})();

/* gallery */
function openGallery() {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-label="Preset gallery"><div style="display:flex;align-items:center"><div style="flex:1"><h2>Preset gallery</h2>
    <div class="muted">Each preset is a recipe, shown on your own photo. Picking one replaces the steps; your current recipe is saved as a checkpoint first.</div></div><button id="gal-close">Close</button></div>
    <div class="gallery">${PRESETS.map((p) => { const r = p.make(); return `<button class="look" data-look="${p.id}"><canvas data-look-cv="${p.id}"></canvas><span class="t">${p.title}</span><span class="s">${p.summary}</span>
      <span class="chain">${p.cmyk ? '<span class="muted" style="font-size:12px">Separate → 4 lanes → Stack</span>' : r.map((s, i) => `<i style="--st:${stv(ioAt(r, i, "image").out)}" title="${DEFS[s.step].name}"></i>`).join("")}</span></button>`; }).join("")}</div></div>`;
  document.body.appendChild(bg);
  requestAnimationFrame(() => bg.querySelectorAll("[data-look-cv]").forEach((cv) => { const p = PRESETS.find((p) => p.id === cv.dataset.lookCv);
    if (p.cmyk) { const L = makeLanes(); drawThumb(cv, null, { draw: (g, w) => drawStack(g, 0, 0, w, { lanes: L, sa: false, minLw: 0.3 * (window.devicePixelRatio || 1) }) }); return; }
    const o = evaluate(p.make()); drawThumb(cv, o[o.length - 1]); }));
}
function applyLook(id) {
  const p = PRESETS.find((x) => x.id === id);
  if (p.cmyk) { document.querySelector(".modal-bg")?.remove(); if (view === "cmyk") leaveCmyk(); return splitCMYK(true); }
  if (view === "cmyk") leaveCmyk();
  proj.checkpoints.unshift({ name: `Before “${p.title}”`, ago: "just now", recipe: clone(recipe) });
  recipe = proj.recipe = p.make(); sel = recipe.length - 1;
  document.querySelector(".modal-bg")?.remove(); renderAll(); toast(`Applied “${p.title}”. Your old recipe is in Checkpoints.`);
}
function renderCpMenu() {
  const m = $("#cp-menu");
  m.innerHTML = `<h4>Checkpoints for this project</h4><p class="explain">A checkpoint is a saved copy of the recipe. Click one to go back to it; where you are now gets saved first, so nothing is lost.</p>${proj.checkpoints.map((c, i) => `<button class="cp" data-cp="${i}"><canvas data-cp-cv="${i}"></canvas><span><span class="t">${c.branch ? "⑂ " : ""}${esc(c.name)}</span><br><span class="s">${c.ago} · ${c.recipe.length} steps</span></span></button>`).join("")}
    `;
  m.querySelectorAll("[data-cp-cv]").forEach((cv) => { const o = evaluate(proj.checkpoints[+cv.dataset.cpCv].recipe); drawThumb(cv, o[o.length - 1]); });
}

/* ---------------- phone viewer ---------------- */
let phView = null, phSel = null, phCompare = 1, phRecipe = null, phTitle = "";
function renderPhone() {
  const root = $("#phone");
  if (!phView) {
    root.innerHTML = `<div class="ph"><div class="ph-head"><span class="brand">plotlab</span><span class="t muted">Projects</span></div><div class="ph-body">
      <p class="ph-note">Viewing only. Edit on a laptop; your projects and checkpoints show up here.</p>
      ${projects.map((p, i) => `<button class="ph-card" data-ph-open="${i}"><canvas data-ph-cv="${i}"></canvas><span><span class="t">${esc(p.name)}</span><br><span class="s">${p.recipe.length} steps · ${p.checkpoints.length} checkpoints</span></span></button>`).join("")}</div></div>`;
    root.querySelectorAll("[data-ph-cv]").forEach((cv) => { const o = evaluate(projects[+cv.dataset.phCv].recipe); drawThumb(cv, o[o.length - 1]); });
    return;
  }
  const p = projects[phView.p], r = phRecipe, o = evaluate(r);
  if (phSel == null) phSel = r.length - 1;
  root.innerHTML = `<div class="ph"><div class="ph-head"><button id="ph-back" aria-label="Back to projects">‹</button><span class="t">${esc(phTitle)}</span></div><div class="ph-body">
    <div class="ph-view"><canvas id="ph-canvas"></canvas></div>
    <div class="ph-ctrl"><span class="muted" style="font-size:12px">Before</span><input type="range" id="ph-cmp" min="0" max="1" step="0.01" value="${phCompare}" aria-label="Before and after"><span class="muted" style="font-size:12px">After</span></div>
    <div class="ph-sec">Steps · tap to look</div>
    <div class="ph-strip">${[-1, ...r.map((_, i) => i)].map((i) => { const d = i < 0 ? null : DEFS[r[i].step], io = i < 0 ? { inn: "image", out: "image" } : ioAt(r, i, "image"), inn = io.inn, out = io.out;
      return `<div class="box ${phSel === i ? "sel" : ""}" data-ph-step="${i}" style="--in:${stv(inn)};--out:${stv(out)}"><div class="band ${inn === out ? "same" : ""}"><span>${STAGES[out].label}</span></div><canvas data-ph-th="${i}"></canvas><div class="lbl">${d ? d.name : "Photo"}</div></div>`; }).join("")}</div>
    <div class="ph-sec">Checkpoints</div>
    <div class="ph-cps">${[{ name: "Current", ago: "latest", recipe: p.recipe }, ...p.checkpoints].map((c, i) => `<button class="cp" data-ph-cp="${i}"><canvas data-ph-cpcv="${i}"></canvas><span><span class="t">${esc(c.name)}</span><br><span class="s">${c.ago}</span></span></button>`).join("")}</div>
  </div></div>`;
  drawPhoneView(o);
  root.querySelectorAll("[data-ph-th]").forEach((cv) => { const i = +cv.dataset.phTh; drawThumb(cv, i < 0 ? SRC : o[i]); });
  const cps = [p.recipe, ...p.checkpoints.map((c) => c.recipe)];
  root.querySelectorAll("[data-ph-cpcv]").forEach((cv) => { const oo = evaluate(cps[+cv.dataset.phCpcv]); drawThumb(cv, oo[oo.length - 1]); });
  root.querySelector(`[data-ph-step="${phSel}"]`)?.scrollIntoView({ inline: "center", block: "nearest" });
}
function drawPhoneView(o) {
  const cv = $("#ph-canvas"); if (!cv) return;
  o = o || evaluate(phRecipe);
  const d = phSel < 0 ? SRC : o[phSel];
  cv._content = drawPaperScene(cv, { data: d, compare: phCompare < 1 ? phCompare : null, before: SRC, padTop: 16 });
}
$("#phone").addEventListener("click", (e) => {
  const t = e.target;
  const op = t.closest("[data-ph-open]"); if (op) { const p = projects[+op.dataset.phOpen]; phView = { p: +op.dataset.phOpen }; phRecipe = p.recipe; phTitle = p.name; phSel = null; phCompare = 1; return renderPhone(); }
  if (t.closest("#ph-back")) { phView = null; return renderPhone(); }
  const st = t.closest("[data-ph-step]"); if (st) { phSel = +st.dataset.phStep; return renderPhone(); }
  const cp = t.closest("[data-ph-cp]"); if (cp) { const p = projects[phView.p], i = +cp.dataset.phCp; phRecipe = i === 0 ? p.recipe : p.checkpoints[i - 1].recipe; phTitle = i === 0 ? p.name : p.checkpoints[i - 1].name; phSel = null; renderPhone(); $("#phone .ph-body").scrollTop = 0; }
});
$("#phone").addEventListener("input", (e) => { if (e.target.id === "ph-cmp") { phCompare = +e.target.value; drawPhoneView(); } });

/* ---------------- variants + phone switch ---------------- */
const isSmall = () => window.matchMedia("(max-width: 700px)").matches;
function applyHash() {
  const h = location.hash.replace("#", "");
  const phone = h === "phone" || isSmall();
  document.body.classList.toggle("phone", phone);
  document.body.classList.toggle("phone-preview", phone && !isSmall());
  const want = proj.isCmyk ? "cmyk" : "editor";
  if (want !== view) {
    if (want === "cmyk") { mainSel = sel; mode = "design"; useLane(cmyk.lane); sel = cmyk.focus === "step" ? cmyk.sel : -1; }
    else { cmyk.sel = sel; useMain(); sel = Math.min(mainSel, recipe.length - 1); }
    view = want;
  }
  document.querySelectorAll("[data-view]").forEach((b) => { b.setAttribute("aria-pressed", String(phone ? b.dataset.view === "phone" : b.dataset.view === "editor")); b.disabled = isSmall() && b.dataset.view !== "phone"; });
  if (phone) renderPhone(); else renderAll();
}
function cycle(dir) { const ks = Object.keys(VARIANTS), i = (ks.indexOf(variant) + dir + ks.length) % ks.length; variant = ks[i]; location.hash = "variant-" + variant; }
$("#proto-bar").addEventListener("click", (e) => { const b = e.target.closest("[data-view]"); if (b) location.hash = b.dataset.view; });
document.addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
  if (document.body.classList.contains("phone")) return;
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); quickSave(); return; }
  if (e.key === "Escape") { closeMenus(); document.querySelector(".modal-bg")?.remove(); }
  else if ((e.key === "Enter" || e.key === " ") && e.target.closest?.("#strip .box")) { e.preventDefault(); e.target.closest(".box").click(); }
});
window.addEventListener("hashchange", applyHash);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (document.body.classList.contains("phone") !== (location.hash === "#phone" || isSmall())) applyHash(); else if (document.body.classList.contains("phone")) drawPhoneView(); else { drawMain(); } }, 80); });
document.addEventListener("scroll", () => positionPopover(), true);

/* ---------------- boot ---------------- */
const img = new Image();
img.onload = () => {
  const c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"); g.drawImage(img, 0, 0, N, N);
  const d = g.getImageData(0, 0, N, N).data, rgb = new Float32Array(N * N * 3);
  for (let i = 0; i < N * N; i++) { rgb[i * 3] = d[i * 4] / 255; rgb[i * 3 + 1] = d[i * 4 + 1] / 255; rgb[i * 3 + 2] = d[i * 4 + 2] / 255; }
  SRC = { kind: "image", rgb };
  makeProjects();
  applyHash();
};
img.src = IMG_SRC;
