name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Upload received golden output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-received
          path: golden/received/
          if-no-files-found: ignore
      - run: pnpm build
